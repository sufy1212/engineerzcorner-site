<style>
  :root{
    --teal:#009999; --teal-dark:#00696D; --petrol:#003D4C;
    --ink:#1A1F26; --ink-dim:#5B6470; --ink-faint:#8C94A0;
    --line:#E3E6E9; --bg:#FFFFFF; --bg-2:#F5F7F8;
    --green:#16A34A; --red:#DC2626; --amber:#D97706;
    --font-display:"Manrope","Arial",-apple-system,sans-serif;
    --font-body:"Inter",-apple-system,Arial,sans-serif;
    --font-mono:"JetBrains Mono","Cascadia Mono","SF Mono","Consolas",ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html{color-scheme:light only;}
  html,body{margin:0;background:var(--bg-2);color:var(--ink);font-family:var(--font-body);}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px 100px;}

  nav.fc-nav{background:var(--petrol);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
  .fc-nav-word{font-family:var(--font-display);font-weight:800;font-size:15px;color:#F3EEDD;letter-spacing:-.01em;}
  .fc-nav-word span{color:#3FE8E8;}
  nav.fc-nav a.fc-back{font-family:var(--font-mono);font-size:11px;color:#B8D9D9;text-decoration:none;letter-spacing:.03em;}
  nav.fc-nav a.fc-back:hover{color:#fff;}

  .fc-hero{text-align:center;margin:30px 0 6px;}
  .fc-hero-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700;}
  .fc-hero h1{font-family:var(--font-display);font-size:24px;font-weight:800;margin:8px 0 4px;color:var(--ink);}
  .fc-hero-sub{font-size:13px;color:var(--ink-dim);}

  .fc-filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0 26px;}
  .fc-filter-btn{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;background:var(--bg);border:1px solid var(--line);color:var(--ink-dim);padding:7px 13px;border-radius:20px;cursor:pointer;transition:transform .12s ease,border-color .15s ease,color .15s ease,background-color .15s ease;}
  .fc-filter-btn:hover{border-color:var(--teal-dark);color:var(--teal-dark);}
  .fc-filter-btn:active{transform:scale(.95);}
  .fc-filter-btn.active{background:var(--petrol);border-color:var(--petrol);color:#F3EEDD;}

  .fc-progress{text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-bottom:14px;}

  .fc-stage{perspective:1200px;max-width:360px;margin:0 auto;}
  .fc-card{
    position:relative;width:100%;height:280px;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transform-style:preserve-3d;transition:transform .35s cubic-bezier(.25,.85,.4,1);will-change:transform;
  }
  .fc-card.flipped{transform:rotateY(180deg);}
  .fc-face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;box-shadow:0 4px 18px rgba(0,61,76,.12);border:1px solid var(--line);
  }
  .fc-face-front{background:var(--bg);}
  .fc-face-back{background:linear-gradient(160deg,var(--petrol),#00272F);color:#F3EEDD;transform:rotateY(180deg);}
  .fc-cat-tag{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-dark);background:rgba(0,153,153,.1);padding:3px 10px;border-radius:20px;margin-bottom:14px;}
  .fc-face-back .fc-cat-tag{color:#3FE8E8;background:rgba(63,232,232,.12);}
  .fc-icon{width:84px;height:84px;display:flex;align-items:center;justify-content:center;color:var(--ink);margin-bottom:10px;}
  .fc-icon svg{width:100%;height:100%;}
  .fc-front-name{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink);text-align:center;}
  .fc-flip-hint{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint);margin-top:14px;letter-spacing:.04em;}
  .fc-back-name{font-family:var(--font-display);font-weight:800;font-size:18px;text-align:center;margin-bottom:10px;}
  .fc-back-desc{font-size:12.5px;line-height:1.55;text-align:center;color:#D6E8E8;}

  .fc-controls{display:flex;justify-content:center;gap:12px;margin-top:22px;}
  .fc-btn{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:8px;padding:10px 18px;cursor:pointer;border:none;transition:transform .12s ease,border-color .15s ease,color .15s ease;}
  .fc-btn:active{transform:scale(.96);}
  .fc-btn-prev{background:#F5F7F8;color:#5B6470;border:1px solid #E3E6E9;}
  .fc-btn-prev:hover{border-color:var(--teal-dark);color:var(--teal-dark);}
  .fc-btn-next{background:#003D4C;color:#F3EEDD;}
  .fc-btn-next:hover{transform:translateY(-1px);}
  .fc-btn-shuffle{background:#F5F7F8;color:#5B6470;border:1px solid #E3E6E9;}
  .fc-btn-shuffle:hover,.fc-btn-shuffle:focus-visible{border-color:var(--teal-dark);color:var(--teal-dark);}

  footer.fc-footer{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:36px;font-family:var(--font-mono);}
  footer.fc-footer a{color:var(--ink-faint);}
</style>

  {cat:"Solar", name:"Bi-Directional Utility Meter", desc:"A meter face with a two-directional arrow, representing the meter that measures energy flowing both from and, under net metering, back to the grid.", svg:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="3"/><path d="M35 42 h30 m-8 -8 l8 8 -8 8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M65 60 h-30 m8 8 l-8 -8 8 -8" fill="none" stroke="currentColor" stroke-width="3"/></svg>'}
];

(function(){
  var cats = [];
  SYMBOL_DATA.forEach(function(s){ if(cats.indexOf(s.cat) === -1) cats.push(s.cat); });

  var order = SYMBOL_DATA.map(function(_,i){ return i; });
  var activeCat = 'All';
  var idx = 0;
  var filtered = order.slice();

  var filtersEl = document.getElementById('fcFilters');
  var countEl = document.getElementById('fcCount');
  var progressEl = document.getElementById('fcProgress');
  var cardEl = document.getElementById('fcCard');

  function buildFilters(){
    var html = '<button class="fc-filter-btn active" data-cat="All">All (' + SYMBOL_DATA.length + ')</button>';
    cats.forEach(function(c){
      var n = SYMBOL_DATA.filter(function(s){ return s.cat === c; }).length;
      html += '<button class="fc-filter-btn" data-cat="' + c + '">' + c + ' (' + n + ')</button>';
    });
    filtersEl.innerHTML = html;
    filtersEl.querySelectorAll('.fc-filter-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        filtersEl.querySelectorAll('.fc-filter-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        activeCat = btn.getAttribute('data-cat');
        applyFilter();
      });
    });
  }

  function applyFilter(){
    filtered = order.filter(function(i){ return activeCat === 'All' || SYMBOL_DATA[i].cat === activeCat; });
    idx = 0;
    render();
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function render(){
    countEl.textContent = SYMBOL_DATA.length + ' Drawing Symbols';
    progressEl.textContent = (idx + 1) + ' of ' + filtered.length + (activeCat !== 'All' ? ' — ' + activeCat : '');
    cardEl.classList.remove('flipped');
    var item = SYMBOL_DATA[filtered[idx]];
    document.getElementById('fcCatFront').textContent = item.cat;
    document.getElementById('fcCatBack').textContent = item.cat;
    document.getElementById('fcIconFront').innerHTML = item.svg;
    document.getElementById('fcBackName').textContent = item.name;
    document.getElementById('fcBackDesc').textContent = item.desc;
  }

  cardEl.addEventListener('click', function(){
    cardEl.classList.toggle('flipped');
  });

  document.getElementById('fcNextBtn').addEventListener('click', function(e){
    e.stopPropagation();
    idx = (idx + 1) % filtered.length;
    render();
  });
  document.getElementById('fcPrevBtn').addEventListener('click', function(e){
    e.stopPropagation();
    idx = (idx - 1 + filtered.length) % filtered.length;
    render();
  });
  document.getElementById('fcShuffleBtn').addEventListener('click', function(e){
    e.stopPropagation();
    filtered = shuffle(filtered);
    idx = 0;
    render();
  });

  buildFilters();
  render();
})();
</script>
