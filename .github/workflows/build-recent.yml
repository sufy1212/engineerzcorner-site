name: Rebuild recent.json / sitemap.xml / feed.xml

# Runs on every push to main â€” including "Add files via upload" commits â€”
# so assets/recent.json, sitemap.xml, and feed.xml never go stale again.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-recent
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # script needs real git log dates, not a shallow clone

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run build-recent.js
        run: node scripts/build-recent.js

      - name: Commit regenerated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/recent.json assets/site-stats.json sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo "Nothing changed â€” skipping commit."
          else
            git commit -m "chore: rebuild recent.json / sitemap.xml / feed.xml [skip build]"
            git push
          fi
