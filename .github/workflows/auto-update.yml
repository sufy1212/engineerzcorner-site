name: Auto-update recent.json & sitemap.xml

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/recent.json'
      - 'sitemap.xml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed so lastmod dates are accurate

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate derived files
        run: python3 scripts/generate-derived-files.py

      - name: Commit changes if any
        run: |
          git config user.name "auto-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/recent.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update recent.json and sitemap.xml [skip ci]"
            git push
          fi
